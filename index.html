<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitud General a RRHH</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header>
      <h1>Solicitud General a RRHH</h1>
      <p>Complet&aacute; el formulario y tu solicitud llegar&aacute; al &aacute;rea de Recursos Humanos.</p>
    </header>

    <form id="rrhh-form" novalidate>
      <div class="field">
        <label for="nombre">Nombre y apellido *</label>
        <input type="text" id="nombre" name="nombre" required autocomplete="name" />
      </div>

      <div class="field">
        <label for="email">Tu correo *</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>

      <div class="field">
        <label for="area">&Aacute;rea / Sector</label>
        <input type="text" id="area" name="area" placeholder="Ej: Log&iacute;stica, Administraci&oacute;n..." />
      </div>

      <div class="field">
        <label for="motivo">Motivo *</label>
        <select id="motivo" name="motivo" required>
          <option value="" disabled selected>Seleccion&aacute; un motivo</option>
          <option value="Consulta general">Consulta general</option>
          <option value="Certificado laboral">Certificado laboral</option>
          <option value="Recibo de sueldo">Recibo de sueldo</option>
          <option value="Cambio de datos personales">Cambio de datos personales</option>
          <option value="Vacaciones / Licencias">Vacaciones / Licencias</option>
          <option value="Otro">Otro</option>
        </select>
      </div>

      <div class="field">
        <label for="mensaje">Detalle de la solicitud *</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
      </div>

      <button type="submit">Enviar solicitud</button>

      <p id="form-status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
